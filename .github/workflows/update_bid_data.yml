name: Update Bid Data

on:
  schedule:
    - cron: '0 0,4,6,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run email crawler (bid-crawler-linquan)
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REGION_NAME: ${{ secrets.REGION_NAME }}
          REGION_KEYWORDS: ${{ secrets.REGION_KEYWORDS }}
        run: |
          cd scripts
          python cloud_email.py

      - name: Run web deployer (bid-web-linquan)
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          REGION_NAME: ${{ secrets.REGION_NAME }}
          REGION_KEYWORDS: ${{ secrets.REGION_KEYWORDS }}
        run: |
          cd scripts
          python cloud_web.py

      - name: Commit history data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/data/bid_history.json || true
          git diff --staged --quiet || git commit -m "chore: update bid_history.json [skip ci]"
          git push