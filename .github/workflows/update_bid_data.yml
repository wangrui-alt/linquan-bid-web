name: Update Bid Data

on:
  # 每天6次自动运行（北京时间 8:00/10:00/12:00/14:00/16:00/18:00）
  schedule:
    - cron: '0 0,2,4,6,8,10 * * *'  # UTC 时间，对应北京时间 8:00/10:00/12:00/14:00/16:00/18:00
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run crawler
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REGION_NAME: ${{ secrets.REGION_NAME }}
          REGION_KEYWORDS: ${{ secrets.REGION_KEYWORDS }}
        run: |
          cd scripts
          python cloud_main.py

      - name: Commit history data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/data/bid_history.json || true
          git diff --staged --quiet || git commit -m "chore: update bid_history.json [skip ci]"
          git push
